<svg width="440" height="260" viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A basketball released from a jump shot, arcing on a parabola and dropping through the net for a swish">
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2138"/><stop offset="0.55" stop-color="#111729"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <radialGradient id="bb-spot" cx="0.62" cy="0.02" r="0.78"><stop offset="0" stop-color="#ffe6bd" stop-opacity="0.20"/><stop offset="0.55" stop-color="#ffd8a0" stop-opacity="0.05"/><stop offset="1" stop-color="#ffd8a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="bb-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c6d35"/><stop offset="0.4" stop-color="#74491f"/><stop offset="1" stop-color="#3a2210"/></linearGradient>
    <radialGradient id="bb-ball" cx="0.36" cy="0.30" r="0.78"><stop offset="0" stop-color="#ffc47a"/><stop offset="0.42" stop-color="#f8862f"/><stop offset="0.82" stop-color="#dd5c14"/><stop offset="1" stop-color="#a83e0c"/></radialGradient>
    <radialGradient id="bb-ballshade" cx="0.5" cy="0.5" r="0.5"><stop offset="0.58" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#5a1e04" stop-opacity="0.5"/></radialGradient>
    <linearGradient id="bb-board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#c9d3e2"/></linearGradient>
    <linearGradient id="bb-rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a4d"/><stop offset="0.5" stop-color="#f4681c"/><stop offset="1" stop-color="#c94d0d"/></linearGradient>
    <linearGradient id="bb-vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070f" stop-opacity="0.30"/><stop offset="0.32" stop-color="#05070f" stop-opacity="0"/><stop offset="0.7" stop-color="#05070f" stop-opacity="0"/><stop offset="1" stop-color="#05070f" stop-opacity="0.45"/></linearGradient>
    <filter id="bb-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bb-soft2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bb-drop" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="bb-card"><rect width="440" height="260" rx="20"/></clipPath>
    <clipPath id="bb-ballclip"><circle cx="0" cy="0" r="15"/></clipPath>
  </defs>
  <style>
    /* The net reacts as a travelling wave: each ring is pushed down and splayed a
       beat after the one above it, timed to the ball's arrival at ~66% of the cycle. */
    .bb-ring, .bb-strandf, .bb-strandb { animation: bb-swish 3.4s ease-out infinite; }
    .r1 { animation-delay: 0s; } .r2 { animation-delay: 0.07s; } .r3 { animation-delay: 0.14s; }
    .bb-strandf, .bb-strandb { animation-name: bb-splay; }
    .bb-spin { animation: bb-spin 0.9s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bb-trail { animation: bb-trail 3.4s linear infinite; }
    .bb-shooter { animation: bb-jump 3.4s ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .bb-crowd { animation: bb-crowd 5s ease-in-out infinite; }
    .bb-ballstatic { display: none; }

    @keyframes bb-swish {
      0%, 62%   { transform: translateY(0) scaleX(1); }
      70%       { transform: translateY(7px) scaleX(1.16); }
      80%       { transform: translateY(2px) scaleX(0.95); }
      88%, 100% { transform: translateY(0) scaleX(1); }
    }
    @keyframes bb-splay {
      0%, 62%   { transform: scaleY(1); }
      70%       { transform: scaleY(1.1); }
      82%       { transform: scaleY(0.98); }
      90%, 100% { transform: scaleY(1); }
    }
    @keyframes bb-spin  { to { transform: rotate(-360deg); } }
    @keyframes bb-trail { 0%, 8% { opacity: 0; } 26% { opacity: 0.24; } 60% { opacity: 0.16; }
                          72%, 100% { opacity: 0; } }
    @keyframes bb-jump {
      0%      { transform: translateY(6px) scaleY(0.97); }
      6%      { transform: translateY(0) scaleY(1); }
      55%     { transform: translateY(1px) scaleY(1); }
      75%     { transform: translateY(6px) scaleY(0.97); }
      100%    { transform: translateY(6px) scaleY(0.97); }
    }
    @keyframes bb-crowd { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .bb-ring, .bb-strandf, .bb-strandb, .bb-spin, .bb-trail, .bb-shooter, .bb-crowd {
        animation: none !important;
      }
      .bb-trail { opacity: 0.2; }
      .bb-ballwrap { display: none; }
      .bb-ballstatic { display: block; }
    }
  </style>
