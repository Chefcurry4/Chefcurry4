<svg width="440" height="260" viewBox="0 0 440 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An orca gliding through deep water, with streamlines wrapping its body and vortices shedding from its fluke tips">
  <defs>
    <linearGradient id="w-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2a3b"/>
      <stop offset="0.45" stop-color="#061b29"/>
      <stop offset="1" stop-color="#030d16"/>
    </linearGradient>
    <radialGradient id="w-pool" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#8fe3f2" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#3f9fc0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3f9fc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="w-ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bff0ff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#bff0ff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#bff0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3841"/>
      <stop offset="0.38" stop-color="#141c24"/>
      <stop offset="1" stop-color="#05090e"/>
    </linearGradient>
    <linearGradient id="w-fin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242d36"/>
      <stop offset="1" stop-color="#070c11"/>
    </linearGradient>
    <linearGradient id="w-belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#eef4f6"/>
      <stop offset="1" stop-color="#cfdbe0"/>
    </linearGradient>
    <linearGradient id="w-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8f4ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#d8f4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="w-spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="w-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="w-vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030d16" stop-opacity="0.34"/>
      <stop offset="0.3" stop-color="#030d16" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#030d16" stop-opacity="0"/>
      <stop offset="1" stop-color="#030d16" stop-opacity="0.5"/>
    </linearGradient>
    <clipPath id="w-card">
      <rect width="440" height="260" rx="20"/>
    </clipPath>
  </defs>

  <style>
    .w-swim   { animation: w-swim 7s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .w-ped    { animation: w-ped 2.6s ease-in-out infinite; transform-origin: 334px 131px; }
    .w-fluke  { animation: w-fluke 2.6s ease-in-out infinite; transform-origin: 352px 134px; }
    .w-pec    { animation: w-pec 3.4s ease-in-out infinite; transform-origin: 148px 174px; }
    .w-pecfar { animation: w-pec 3.4s ease-in-out infinite -0.5s; transform-origin: 176px 168px; }
    .w-dorsal { animation: w-dorsal 4.2s ease-in-out infinite; transform-origin: 224px 95px; }
    .w-blink  { animation: w-blink 7s infinite; transform-box: fill-box; transform-origin: center; }
    .w-flow   { stroke-dasharray: 4 10; animation: w-flow 1.9s linear infinite; }
    .w-rays   { animation: w-rays 11s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0; }
    .w-p      { animation: w-rise 12s linear infinite; transform-box: fill-box; }
    .w-vtx    { animation: w-shed 3.2s linear infinite; transform-box: fill-box; transform-origin: center; opacity: 0; }
    .w-bub    { animation: w-bub 6s ease-out infinite; transform-box: fill-box; opacity: 0; }

    @keyframes w-swim {
      0%, 100% { transform: translate(0, -4px) rotate(-0.7deg); }
      50%      { transform: translate(0, 4px) rotate(0.7deg); }
    }
    @keyframes w-ped   { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes w-fluke { 0%,100% { transform: rotate(7deg); }  50% { transform: rotate(-8deg); } }
    @keyframes w-pec   { 0%,100% { transform: rotate(5deg); }  50% { transform: rotate(-6deg); } }
    @keyframes w-dorsal{ 0%,100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }
    @keyframes w-blink { 0%,95%,100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    @keyframes w-flow  { to { stroke-dashoffset: -14; } }
    @keyframes w-rays  { 0%,100% { opacity: 0.75; transform: skewX(0deg); } 50% { opacity: 1; transform: skewX(1.6deg); } }
    @keyframes w-rise  {
      0%   { transform: translate(0, 0); opacity: 0; }
      12%  { opacity: 1; }
      88%  { opacity: 1; }
      100% { transform: translate(-14px, -120px); opacity: 0; }
    }
    @keyframes w-shed {
      0%   { transform: translate(0,0) scale(0.5) rotate(0deg); opacity: 0; }
      18%  { opacity: 0.55; }
      100% { transform: translate(46px,0) scale(1.5) rotate(38deg); opacity: 0; }
    }
    @keyframes w-bub {
      0%   { transform: translate(0,0) scale(0.6); opacity: 0; }
      8%   { opacity: 0.5; }
      70%  { opacity: 0.35; }
      100% { transform: translate(-10px,-78px) scale(1.1); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .w-swim, .w-ped, .w-fluke, .w-pec, .w-pecfar, .w-dorsal,
      .w-blink, .w-flow, .w-rays, .w-p, .w-bub { animation: none !important; }
      .w-vtx { animation: none !important; opacity: 0.4; }
      .w-v2  { opacity: 0.22; }
    }
  </style>

  <g clip-path="url(#w-card)">
    <rect width="440" height="260" fill="url(#w-water)"/>
    <rect width="440" height="260" fill="url(#w-pool)"/>

    <!-- shafts of light from the surface -->
    <g class="w-rays">
      <path d="M92,-10 L138,-10 L74,270 L44,270 Z" fill="url(#w-ray)"/>
      <path d="M186,-10 L214,-10 L156,270 L136,270 Z" fill="url(#w-ray)" opacity="0.7"/>
      <path d="M300,-10 L356,-10 L282,270 L246,270 Z" fill="url(#w-ray)" opacity="0.55"/>
      <path d="M398,-10 L418,-10 L372,270 L358,270 Z" fill="url(#w-ray)" opacity="0.45"/>
    </g>

    <!-- surface caustics -->
    <g stroke="#bdeeff" fill="none" opacity="0.12" filter="url(#w-soft)">
      <path d="M-10,12 C40,4 60,20 104,14 C150,7 168,22 214,15 C260,8 280,23 326,16 C372,9 396,22 450,14" stroke-width="2.4"/>
      <path d="M-10,28 C46,22 68,34 118,29 C170,23 190,36 240,30 C292,24 312,36 366,30 C410,25 430,32 450,29" stroke-width="1.6" opacity="0.7"/>
    </g>

    <!-- suspended particulate -->
    <g fill="#cfeeff">
      <circle class="w-p" cx="38"  cy="196" r="1.2" opacity="0.30" style="animation-duration:14s;animation-delay:-2s"/>
      <circle class="w-p" cx="86"  cy="232" r="0.9" opacity="0.24" style="animation-duration:17s;animation-delay:-9s"/>
      <circle class="w-p" cx="128" cy="210" r="1.5" opacity="0.20" style="animation-duration:12s;animation-delay:-5s"/>
      <circle class="w-p" cx="172" cy="244" r="1.0" opacity="0.28" style="animation-duration:16s;animation-delay:-1s"/>
      <circle class="w-p" cx="214" cy="216" r="0.8" opacity="0.22" style="animation-duration:13s;animation-delay:-11s"/>
      <circle class="w-p" cx="262" cy="238" r="1.3" opacity="0.26" style="animation-duration:15s;animation-delay:-6s"/>
      <circle class="w-p" cx="308" cy="204" r="0.9" opacity="0.20" style="animation-duration:18s;animation-delay:-3s"/>
      <circle class="w-p" cx="352" cy="230" r="1.1" opacity="0.25" style="animation-duration:12s;animation-delay:-8s"/>
      <circle class="w-p" cx="396" cy="212" r="1.4" opacity="0.18" style="animation-duration:16s;animation-delay:-13s"/>
      <circle class="w-p" cx="60"  cy="120" r="0.9" opacity="0.16" style="animation-duration:19s;animation-delay:-4s"/>
      <circle class="w-p" cx="256" cy="64"  r="1.0" opacity="0.14" style="animation-duration:20s;animation-delay:-10s"/>
      <circle class="w-p" cx="408" cy="96"  r="1.2" opacity="0.15" style="animation-duration:15s;animation-delay:-7s"/>
    </g>

    <!-- ===== flow field: streamlines wrapping the hull ===== -->
    <g fill="none" stroke="#7fd4e8" stroke-linecap="round">
      <path class="w-flow" d="M-10,44 C90,42 190,38 268,44 C330,49 386,55 450,58" stroke-width="1.1" opacity="0.16"/>
      <path class="w-flow" d="M-10,72 C70,70 150,62 214,64 C286,66 362,74 450,80" stroke-width="1.2" opacity="0.20" style="animation-delay:-0.5s"/>
      <path class="w-flow" d="M-10,104 C40,100 72,88 118,80 C176,70 232,74 286,90 C340,106 396,116 450,120" stroke-width="1.3" opacity="0.26" style="animation-delay:-1.1s"/>
      <path class="w-flow" d="M-10,132 C20,130 30,126 36,120 C30,146 44,166 74,178 C130,198 200,196 268,178 C322,164 380,152 450,148" stroke-width="1.4" opacity="0.24" style="animation-delay:-0.3s"/>
      <path class="w-flow" d="M-10,168 C50,172 96,190 158,200 C224,210 300,200 366,184 C400,176 428,172 450,170" stroke-width="1.2" opacity="0.20" style="animation-delay:-1.4s"/>
      <path class="w-flow" d="M-10,206 C80,212 170,222 258,214 C330,207 392,198 450,192" stroke-width="1.1" opacity="0.15" style="animation-delay:-0.8s"/>
    </g>

    <!-- ===== the whale ===== -->
    <g class="w-swim">

      <!-- far-side pectoral, behind the body -->
      <g class="w-pecfar">
        <path fill="#0b1218" opacity="0.9"
          d="M176,166 C198,173 220,187 234,201 C241,208 236,215 228,211
             C211,204 189,192 176,179 C168,172 169,164 176,166 Z"/>
      </g>

      <!-- peduncle + flukes (overlaps the body's stalk so the joint never opens) -->
      <g class="w-ped">
        <g class="w-fluke">
          <path fill="url(#w-fin)"
            d="M334,122 C348,123 361,127 370,132
               C382,123 398,113 411,104 C419,99 427,105 421,113
               C412,127 396,138 380,145
               C395,151 410,162 419,173 C425,180 417,187 410,180
               C396,168 376,157 359,150
               C350,147 340,141 334,137 Z"/>
          <!-- pale underside catching the light on the lower lobe -->
          <path fill="url(#w-belly)" opacity="0.20" filter="url(#w-soft)"
            d="M363,152 C382,159 401,169 413,179 C396,167 377,157 361,151 Z"/>
        </g>
      </g>

      <!-- body -->
      <path fill="url(#w-body)"
        d="M40,138
           C40,120 56,102 88,93
           C126,83 172,82 208,90
           C252,100 298,114 330,127
           C340,131 348,133 354,135
           C348,137 340,139 330,143
           C298,158 252,170 208,177
           C172,185 126,186 88,176
           C60,169 42,156 40,138 Z"/>

      <!-- countershading: white throat, belly, and the rear flank flash -->
      <path fill="url(#w-belly)"
        d="M46,146
           C72,153 112,158 152,159
           C192,160 228,158 260,153
           C282,149 298,144 312,140
           C316,146 313,153 306,158
           C282,168 250,175 212,178
           C172,185 126,186 88,176
           C62,169 48,158 46,146 Z"/>

      <!-- soft shadow where the white wraps under -->
      <path fill="#050a10" opacity="0.20" filter="url(#w-soft)"
        d="M50,148 C80,156 130,162 180,162 C230,162 276,155 310,142
           C276,152 230,159 180,159 C130,159 80,154 50,148 Z"/>

      <!-- grey saddle patch, behind and below the dorsal -->
      <path fill="#75838d" opacity="0.50" filter="url(#w-soft)"
        d="M248,101 C272,106 292,114 306,123 C288,121 262,116 244,112 C243,107 245,103 248,101 Z"/>

      <!-- eye patch -->
      <ellipse cx="126" cy="141" rx="19" ry="7.6" fill="#edf3f4" transform="rotate(-20 126 141)"/>

      <!-- eye, at the front-lower corner of the patch -->
      <g class="w-blink">
        <ellipse cx="104" cy="149" rx="4.4" ry="3.8" fill="#04070a"/>
        <circle cx="102.6" cy="147.6" r="1.2" fill="#ffffff" opacity="0.8"/>
      </g>

      <!-- mouth line -->
      <path d="M45,152 C64,159 86,162 110,161" fill="none" stroke="#04070a" stroke-width="1.5" opacity="0.28" stroke-linecap="round"/>

      <!-- blowhole -->
      <path d="M116,92 C120,90 125,91 126,94" fill="none" stroke="#000" stroke-width="1.5" opacity="0.42" stroke-linecap="round"/>

      <!-- glossy back sheen -->
      <path fill="url(#w-sheen)"
        d="M84,102 C124,89 176,88 218,96 C176,94 128,98 96,110 C90,108 86,105 84,102 Z"/>
      <ellipse cx="112" cy="112" rx="30" ry="10" fill="url(#w-spec)" transform="rotate(-16 112 112)"/>

      <!-- rim light along the head and back -->
      <path d="M50,128 C62,110 84,97 116,90 C160,81 196,82 226,90"
        fill="none" stroke="#a9e4f7" stroke-opacity="0.30" stroke-width="2.2"
        stroke-linecap="round" filter="url(#w-soft)"/>

      <!-- near-side pectoral -->
      <g class="w-pec">
        <path fill="url(#w-fin)"
          d="M148,171 C172,178 202,195 226,213
             C235,220 230,229 219,225
             C197,218 168,202 150,187
             C140,179 137,170 142,168
             C144,167 146,169 148,171 Z"/>
      </g>

      <!-- dorsal fin -->
      <g class="w-dorsal">
        <path fill="url(#w-fin)"
          d="M196,90
             C204,64 214,40 227,26
             C232,20 239,23 238,31
             C234,53 233,76 252,99
             C234,99 213,96 196,90 Z"/>
      </g>

      <!-- blowhole exhalation -->
      <g fill="#dff6ff">
        <circle class="w-bub" cx="122" cy="88" r="2.2" style="animation-delay:-0.2s"/>
        <circle class="w-bub" cx="127" cy="86" r="1.4" style="animation-delay:-1.1s"/>
        <circle class="w-bub" cx="118" cy="87" r="1.7" style="animation-delay:-2.4s"/>
      </g>
    </g>

    <!-- ===== vortices shedding from the fluke tips ===== -->
    <g fill="none" stroke="#8fe3f2" stroke-linecap="round" stroke-width="1.5">
      <g class="w-vtx" style="animation-delay:0s">
        <path d="M410,112 C422,107 432,114 429,124 C426,132 415,133 412,126 C410,121 415,117 419,119"/>
      </g>
      <g class="w-vtx w-v2" style="animation-delay:-1.6s">
        <path d="M410,172 C422,177 431,170 428,161 C425,153 414,152 411,159 C409,164 414,168 418,166"/>
      </g>
    </g>

    <!-- vignette -->
    <rect width="440" height="260" fill="url(#w-vig)"/>

    <text x="20" y="240" fill="#a9e4f7" fill-opacity="0.55" font-size="9" letter-spacing="2.2"
      font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">ORCINUS ORCA</text>
    <text x="420" y="240" text-anchor="end" fill="#a9e4f7" fill-opacity="0.38" font-size="9" letter-spacing="1.4"
      font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Re ≈ 10⁷</text>
  </g>

  <rect x="0.5" y="0.5" width="439" height="259" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
</svg>
